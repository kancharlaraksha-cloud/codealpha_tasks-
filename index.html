<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Docker Web Server</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            max-width: 650px;
        }

        h1 {
            color: #2496ed;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            font-weight: normal;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 20px;
            background: #2496ed;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐳 CodeAlpha Docker Web Server</h1>
        <h2>Containerized Web Application</h2>

        <p>
            This web server is running inside a Docker container.
        </p>

        <p>
            This project demonstrates Docker image creation,
            container deployment, port mapping, and container management.
        </p>

        <div class="badge">Docker Container Running</div>
    </div>
</body>
</html>
